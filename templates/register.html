{% extends 'base.html' %}
{% block title %}Register — LocalFind{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="form-card">
    <div class="auth-logo">
      <div class="logo-mark">🔧</div>
      <h2>Create Account</h2>
      <p>Join LocalFind to hire or offer services</p>
    </div>

    <form method="POST" action="/register" novalidate>
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <div style="position:relative;">
          <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);"><i class="fas fa-user"></i></span>
          <input type="text" name="name" class="form-control" style="padding-left:40px;" placeholder="Ali Hassan" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div style="position:relative;">
          <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);"><i class="fas fa-envelope"></i></span>
          <input type="email" name="email" class="form-control" style="padding-left:40px;" placeholder="you@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative;">
          <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);"><i class="fas fa-lock"></i></span>
          <input type="password" name="password" id="pw1" class="form-control" style="padding-left:40px;padding-right:44px;" placeholder="Min 6 characters" required>
          <button type="button" onclick="togglePw('pw1','eye1')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);">
            <i class="fas fa-eye" id="eye1"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <div style="position:relative;">
          <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);"><i class="fas fa-lock"></i></span>
          <input type="password" name="confirm_password" class="form-control" style="padding-left:40px;" placeholder="Repeat password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-md btn-full" style="margin-top:8px;">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
    </form>

    <div class="divider"><span>Already have an account?</span></div>

    <a href="/login" class="btn btn-outline-primary btn-md btn-full">
      <i class="fas fa-sign-in-alt"></i> Log In
    </a>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePw(inputId, iconId) {
  const input = document.getElementById(inputId);
  const icon  = document.getElementById(iconId);
  if (input.type === 'password') {
    input.type = 'text';
    icon.classList.replace('fa-eye', 'fa-eye-slash');
  } else {
    input.type = 'password';
    icon.classList.replace('fa-eye-slash', 'fa-eye');
  }
}
</script>
{% endblock %}
