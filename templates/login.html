{% extends 'base.html' %}
{% block title %}Login — Local Service Finder{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="form-card">
    <div class="auth-logo">
      <div class="logo-mark">🔑</div>
      <h2>Welcome Back</h2>
      <p>Sign in to your Local Service Finder account</p>
    </div>

    <form method="POST" action="/login">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div style="position:relative;">
          <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);"><i class="fas fa-envelope"></i></span>
          <input type="email" name="email" class="form-control" style="padding-left:40px;" placeholder="you@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative;">
          <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);"><i class="fas fa-lock"></i></span>
          <input type="password" name="password" id="pw" class="form-control" style="padding-left:40px;padding-right:44px;" placeholder="Your password" required>
          <button type="button" onclick="togglePw()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);">
            <i class="fas fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-md btn-full" style="margin-top:8px;">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>

    <div class="divider"><span>Don't have an account?</span></div>

    <a href="/register" class="btn btn-outline-primary btn-md btn-full">
      <i class="fas fa-user-plus"></i> Create Account
    </a>

    <div style="text-align:center; margin-top:20px;">
      <a href="/admin" style="font-size:12px; color:var(--text-muted);">
        <i class="fas fa-shield-alt"></i> Admin Login
      </a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePw() {
  const input = document.getElementById('pw');
  const icon  = document.getElementById('eyeIcon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.classList.replace('fa-eye', 'fa-eye-slash');
  } else {
    input.type = 'password';
    icon.classList.replace('fa-eye-slash', 'fa-eye');
  }
}
</script>
{% endblock %}
